  body[data-theme="dark"]{
    --bg:#151619; --bg2:#1e2024; --bg3:#26282e; --card:#22242a;
    --text:#e8eaed; --muted:#9aa0a8; --border:#2e3138;
    --glass:rgba(30,32,36,.75); --shadow:0 8px 32px rgba(0,0,0,.45);
    --glow:rgba(88,101,242,.25);
  }
  body[data-theme="light"]{
    --bg:#f4f5f7; --bg2:#e9ebef; --bg3:#ffffff; --card:#ffffff;
    --text:#1a1c20; --muted:#5f6670; --border:#d8dce3;

  .brand{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:700}
  .brand img{width:40px;height:40px;border-radius:12px;box-shadow:0 0 16px var(--glow);animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 10px var(--glow)}50%{box-shadow:0 0 22px var(--glow)}}
  .brand span{font-size:.72rem;color:var(--muted);font-weight:400}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--bg2);
    border-radius:12px;padding:9px 14px;border:1px solid var(--border);transition:var(--tr)}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:.95rem}

  /* ===== PRZEŁĄCZNIK TEMATU ===== */
  .theme-btn{border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;
    border-radius:12px;padding:8px 12px;font-size:1rem;transition:var(--tr);display:flex;align-items:center;gap:6px}
  .theme-btn:hover{border-color:var(--accent);transform:scale(1.05)}
  .theme-btn small{font-size:.7rem;color:var(--muted)}

  /* ===== FILTRY ===== */
  .filters{background:var(--bg2);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    position:sticky;top:65px;z-index:40;border-bottom:1px solid var(--border)}
  .tab{border:1px solid transparent;border-radius:20px;padding:7px 16px;cursor:pointer;font-weight:600;
    font-size:.85rem;background:var(--bg);color:var(--muted);transition:all var(--tr)}
  .tab:hover{color:var(--text);transform:translateY(-2px)}
  .tab.active{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .tab.active.r{background:var(--r-bg);color:#fff}
  .tab.active.pf{background:var(--pf-bg);color:#111}
  .tab.active.f{background:var(--f-bg);color:#fff}
  .tab.active.all{background:var(--accent);color:#fff}
  select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
    padding:7px 10px;font-size:.85rem;cursor:pointer;transition:var(--tr)}

  .count{margin-left:auto;color:var(--muted);font-size:.85rem}

  @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}

  .card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);

  .skeleton .sk-line{height:14px;margin:12px 14px;border-radius:6px;
    background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
  .skeleton .sk-line.short{width:60%}
</style>

const THEMES = ['dark','light','system'];
let themeIdx = parseInt(localStorage.getItem('tl-theme') ?? '0');
function applyTheme(){
  const t = THEMES[themeIdx];
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const eff = t === 'system' ? (sysDark ? 'dark' : 'light') : t;
  document.body.dataset.theme = eff;
  document.getElementById('themeBtn').firstChild.textContent = eff === 'dark' ? '🌙 ' : '☀️ ';
  document.getElementById('themeLabel').textContent = t === 'system' ? 'system' : eff;
  localStorage.setItem('tl-theme', themeIdx);
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  themeIdx = (themeIdx + 1) % THEMES.length; applyTheme();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
  if(THEMES[themeIdx]==='system') applyTheme();
});

async function tryFetch(url){
  const r = await fetch(url + (url.includes("?")?"&":"?") + "v=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

    html += `<a class="btn livery" href="${m.liveryUrl}" target="_blank">🎨 Pobierz malowanie (darmowe)</a>`;
  else if(m.tags.includes("PM"))
    html += `<a class="btn livery buy" href="${m.liveryUrl}" target="_blank">💜 Kup malowanie (VIP)</a>`;
  html += `<a class="btn discord" href="${DISCORD_URL}" target="_blank">💬 Discord</a>`;
  return html;
}

function render(){
  const grid = document.getElementById('grid');
  const q = query.toLowerCase();
  const list = MALOWANIA.filter(m=>{
    if(activeCat!=="all" && m.cat!==activeCat) return false;
    if(activeRegion && m.region!==activeRegion) return false;
    if(q){
      const hay = (m.title+" "+m.model+" "+m.region+" "+m.tags.join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  document.getElementById('count').textContent = "Znaleziono: " + list.length;
  if(!list.length){ grid.innerHTML = '<div class="empty">😶 Nic nie znaleziono…</div>'; return; }

  grid.innerHTML = list.map(m=>{
    const real = MALOWANIA.indexOf(m);
    return `<div class="card" onclick="openLB(${real},0)">
      <div class="imgwrap">
        <span class="badge ${m.cat.toLowerCase()}">[${m.cat}] ${CATNAMES[m.cat]}</span>
        ${priceBadge(m)}
        <img src="${m.img}" loading="lazy" alt="${m.title}" onerror="this.src='https://placehold.co/640x400/2b2d31/dbdee1?text=OMSI+2'">
      </div>
      <div class="info">
        <h3>${m.title}</h3>
        <div class="meta">🗺️ ${m.region} &nbsp;•&nbsp; 📅 ${m.date}</div>
        <div class="tags">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

/* skeleton loading przy pierwszym ładowaniu */
(function(){
  const grid = document.getElementById('grid');
  grid.innerHTML = Array.from({length:4}, ()=>'<div class="skeleton"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>').join('');
})();

/* ===== LIGHTBOX ===== */
function openLB(mi, ii){
  const m = MALOWANIA[mi];
  lb = {items: m.images.length ? m.images : [m.img], idx: ii, data: m};
  document.getElementById('lbTitle').textContent = m.title;
  document.getElementById('lbMeta').innerHTML =
    `<b>[${m.cat}] ${CATNAMES[m.cat]}</b> • ${m.model} • 🗺️ ${m.region} • 📅 ${m.date} • ${m.tags.map(t=>`#${t}`).join(' ')}`;
  document.getElementById('lbBtns').innerHTML = actionButtons(m);
  showImg();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function showImg(){
  const im = document.getElementById('lbImg');
  im.style.animation='none'; void im.offsetWidth; im.style.animation='';
  im.src = lb.items[lb.idx];
  document.getElementById('lbCounter').textContent = (lb.idx+1) + " / " + lb.items.length;
}
function navLB(d){ lb.idx = (lb.idx + d + lb.items.length) % lb.items.length; showImg(); }
function closeLB(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

/* ===== EVENTY ===== */
document.getElementById('discordBanner').href = DISCORD_URL;
document.getElementById('search').addEventListener('input', e=>{ query = e.target.value; render(); });
document.getElementById('region').addEventListener('change', e=>{ activeRegion = e.target.value; render(); });
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); activeCat = t.dataset.cat; render();
}));
document.addEventListener('keydown', e=>{
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeLB();
  if(e.key==='ArrowLeft') navLB(-1);
  if(e.key==='ArrowRight') navLB(1);
});
document.getElementById('lbImg').addEventListener('click', ()=>navLB(1));

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
